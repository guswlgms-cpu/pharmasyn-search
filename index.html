  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12151b; --panel: #1b1f27; --ink: #e6e9ef; --muted: #98a2b3; --line: #2c323d;
      --accent: #7aa2ff; --accent-ink: #0d1424; --accent-soft: #1f2a44; --hit: #5a4b00; --chip: #252a34;

    }
  }
  :root[data-theme="dark"] {
    --bg: #12151b; --panel: #1b1f27; --ink: #e6e9ef; --muted: #98a2b3; --line: #2c323d;
    --accent: #7aa2ff; --accent-ink: #0d1424; --accent-soft: #1f2a44; --hit: #5a4b00; --chip: #252a34;

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);

  .wrap { max-width: 980px; margin: 0 auto; padding-block: 28px 60px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

  .search { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding: 10px 0 12px; }
  .search input { width: 100%; font: inherit; font-size: 17px; padding: 13px 16px; border-radius: 12px;

  .search input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
  .hints { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; align-items: center; }
  .hints span.lbl { color: var(--muted); font-size: 12.5px; margin-right: 2px; }
  .chip { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 999px;
    padding: 3px 10px; font-size: 12.5px; cursor: pointer; font-family: inherit; }
  .chip:hover { border-color: var(--accent); color: var(--accent); }
  .chip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .status { color: var(--muted); font-size: 13px; margin: 6px 2px 14px; }
  .status b { color: var(--ink); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px;
    margin-bottom: 14px; display: grid; grid-template-columns: 300px 1fr; gap: 18px; }
  .card .toc { width: 100%; border-radius: 8px; background: var(--img-bg); border: 1px solid var(--line); cursor: zoom-in; }
  .meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
  .badge { padding: 1px 8px; border-radius: 6px; font-weight: 600; font-size: 11.5px; }
  .badge.methodology { background: var(--method-soft); color: var(--method); }
  .badge.medchem { background: var(--med-soft); color: var(--med); }
  .badge.other { background: var(--chip); color: var(--muted); }
  details.abs { margin-top: 10px; font-size: 13px; }
  details.abs summary { cursor: pointer; color: var(--accent); }
  details.abs p { margin: 6px 0 0; color: var(--ink); line-height: 1.6; }
  .more { display: block; margin: 8px auto 0; padding: 10px 26px; border-radius: 999px; border: 1px solid var(--line);
    background: var(--panel); color: var(--ink); font: inherit; cursor: pointer; }
  .more:hover { border-color: var(--accent); color: var(--accent); }
  .card h2 { font-size: 16.5px; margin: 6px 0 10px; line-height: 1.4; letter-spacing: -0.01em; }
  .card h2 a { color: inherit; text-decoration: none; }
  .card h2 a:hover { color: var(--accent); text-decoration: underline; }
  dl { display: grid; grid-template-columns: 92px 1fr; gap: 4px 10px; margin: 0; font-size: 13.5px; }
  dt { color: var(--muted); }
  dd { margin: 0; }
  dd .v { display: inline-block; background: var(--chip); border-radius: 5px; padding: 0 6px; margin: 1px 4px 1px 0; }
  mark { background: var(--hit); color: inherit; border-radius: 3px; padding: 0 1px; }
  .why { margin-top: 10px; font-size: 12.5px; color: var(--muted); }
  .why b { color: var(--accent); font-weight: 600; }
  .foot { margin-top: 10px; font-size: 12px; color: var(--muted); display: flex; gap: 14px; flex-wrap: wrap; }
  .foot a { color: var(--accent); }
  .empty { text-align: center; color: var(--muted); padding: 50px 0; }
  .zoom { position: fixed; inset: 0; background: rgba(0,0,0,.75); display: none; align-items: center;
    justify-content: center; z-index: 20; padding: 16px; cursor: zoom-out; }
  .zoom img { max-width: 100%; max-height: 100%; background: var(--img-bg); border-radius: 8px; }
  @media (max-width: 720px) {
    .card { grid-template-columns: 1fr; }
    dl { grid-template-columns: 78px 1fr; }
  }

</style>

window.ABSTRACTS = {
    "228":  "The envelope (E) protein of the Dengue virus (DENV) is critical for virion attachment and membrane fusion with the host cell, as well as the release of the viral RNA genome into the cytoplasm. In this study, we describe the design, synthesis, and biological evaluation of novel viral entry inhibitors containing an acridone core. Notably, compound 13e demonstrated potent cellular antiviral activity (IC50 = 8.6 μM and selectivity index = 21.4). Compound 13e was evaluated using several methods, including time-of-addition and virus entry/binding assays, which revealed that it selectively blocked DENV2 infection by inhibiting virion attachment. Furthermore, compound 13e exhibited potent antiviral efficacy, as evidenced by viremia quantification and histopathological analysis results, without causing significant body weight loss or other toxicities. Furthermore, target engagement assay supported the role of compound 13e as an E protein binder, consistent with its function as an entry inhibitor.",
    "227":  "Selective lysine-specific demethylase 1 (LSD1) inhibition has emerged as a robust strategy for small cell lung cancer (SCLC) eradication. Herein, we describe the structural design, synthesis, and biological evaluation of novel reversible LSD1 inhibitors containing a carboxamido pyrazole core with a pyrrolidine-substituted phenyl ring. Notably, compound 10q demonstrated potent LSD1 inhibition with an IC50 value of 7.2 nM and effective H1417 cell growth inhibition with a GI50 value of 20.0 nM. Moreover, it showed notable selectivity against homologous proteins and demethylases. The oral administration of compound 10q demonstrated encouraging pharmacokinetic profiles and remarkable antitumor efficacy in the NCI-H1417 SCLC xenograft model using NOD/Shi-scid/IL-2Rγnull mice without notable toxicity. Furthermore, the potential of compound 10q is proposed by combinatorial therapy with chemotherapeutic agents for treating SCLC. Therefore, compound 10q can be considered a promising candidate as a selective and orally bioavailable LSD1 inhibitor.",
    "224":  "A rhodium(III)-catalyzed C–H functionalization of azomethine imines with vinyl cyclopropanes (VCPs) is proposed. Mechanistically, VCPs participate in olefin insertion and β-C elimination to produce allylated intermediates, which undergo endotype [3 + 2] dipolar cycloaddition, providing indenopyrazolopyrazolones. Post-transformations of malonate-containing tetracyclic N -heterocycles highlight the synthetic relevance of the proposed method.",
    "223":  "Capping is a natural and distinctive modification that occurs at the 5\u0027-end of eukaryotic messenger RNA (mRNA), which regulates biological functions for gene expression events. Recently, the synthetic variation of a 5\u0027-cap element has attracted considerable attention for improving the transcriptional efficiency and stability of mRNA. Herein, we describe the synthesis and biological evaluation of trinucleotide 5\u0027-capping agents with 2\u0027- and 3\u0027-ribose modifications. The 3\u0027-O-mesylated m7GpppAmG 43 demonstrated a high capping efficiency of 97.1%, comparable to the commercial CleanCapAG(3\u0027OMe) 9. Furthermore, compound 43 exhibited a potent translational ability in the dual luciferase reporter assay, which was 1.8-fold higher than that of compound 9. Moreover, compound 43 was resistant against decapping enzymes (DcpS and hDcp2), thereby revealing its stability under biological conditions. In vivo translational studies demonstrated that lipid nanoparticle 43a, formulated from compound 43 with firefly luciferase mRNA, exhibited intense bioluminescence, supporting its translational competence.",
    "222":  "The cGAS-STING signaling pathway is an essential mechanism in the recruitment and activation of innate and adaptive immune cells to exert an antitumor response in cancer immunotherapy. cGAMP is a crucial immunotransmitter, which is potentially degraded by ENPP1, resulting in the deactivation of STING-mediated antitumor immune responses. We herein describe the design, synthesis, and biological evaluation of novel ENPP1 inhibitors containing a benzotriazole core and a sulfonimidamide Zn binder. Notably, compound 44a demonstrated potent and selective ENPP1 inhibition with an IC50 value of 13.1 nM and effectively activated the STING pathway in HCT116-Dual™ cells. Additionally, compound 44a exhibited a notable release of cytokines in THP-1 cell lines, thereby enhancing the innate immune response. The oral administration of compound 44a displayed remarkable antitumor efficacy in the MC38 syngeneic mouse model without notable toxicity. Therefore, compound 44a can be considered a promising candidate as a selective and orally bioavailable ENPP1 inhibitor.",
    "221":  "The incorporation of a nitrogen unit into target molecules by generating nitrene species has become a hot topic in modern organic synthesis. In this study, we report a Co(III)-catalyzed C5-H amination of thiochromones with anthranils as aminating surrogates. The significance of this coupling reaction was demonstrated via a broad range of substrates and complete site selectivity. Moreover, post-transformations of synthesized products are described.",
    "219":  "G12D is a dominant mutant of KRAS, accounting for 67.6% of PDAC cases, which drives the development of selective KRAS-G12D inhibitors in cancer therapy. Herein, we describe the rationale design, synthesis, and biological evaluation of KRAS-G12D inhibitors with pyrazoloquinazoline and 3,5-ethylene-bridged piperazine groups as the key pharmacophores. Compound 53a exhibited comparable binding to KRAS-G12D (ΔTm = 12.1 °C) and potent in vitro activities (IC50 values of 8.4 nM and 19.5 nM against p-ERK and proliferation of AsPC-1 cells, respectively), compared to those of MRTX1133 as a reference standard. Furthermore, compound 53a displayed appreciable plasma exposure, bioavailability, and pharmacokinetic profiles after oral administration, overcoming the poor oral bioavailability observed in MRTX1133. In vivo study showed that 53a significantly inhibited tumor growth in the AsPC-1 xenograft mouse model by inhibiting KRAS-G12D. These findings support 53a as a promising lead candidate for the development of selective KRAS-G12D targeted cancer therapies.",
    "217":  "DU8ML, a fast and accurate machine learning-augmented DFT method for computing NMR spectra, has proven effective for high-throughput revision of misassigned natural products. In this paper, we continue with another important underexplored challenge: revision of incorrect product structures of reported organic reactions, often necessitating correction of reaction mechanisms.",
    "216":  "Succinimide motifs are recognized as privileged cores in anticonvulsants and antipsychotics such as phensuximide, ethosuximide, and lurasidone. These succinimides can be readily converted into pharmaceutically important pyrrolidines and γ-lactam scaffolds, making them highly promising compounds in drug discovery. Nitroarenes are also important chemical feedstocks and have attracted increased attention owing to their versatile applications in pharmaceuticals, functional materials, and agricultural pharmacology. Therefore, directly combining succinimides with nitroarenes is a valuable approach for efficiently constructing novel succinimide-linked nitroarene frameworks. We herein report the site-selective addition of the succinimide scaffold to various nitroarenes via nitro-directed ortho-C-H alkylation using maleimides under rhodium(III) catalysis. The versatility of the developed protocol is demonstrated through nitro-group reduction, reductive cyclization of the synthesized products, and selective modifications of the succinimide framework. Mechanistic studies, including deuterium-labeling and kinetic isotope effect experiments, helped elucidate a plausible reaction mechanism.",
    "215":  "The A1, A2A, and A2B adenosine receptors are prime targets for immune cell activation and tumor suppression. Herein, we describe the rationale design, synthesis, and biological evaluation of 6-aminonicotinonitrile derivatives as triple A1/A2A/A2B adenosine receptor antagonists. Compound 14a demonstrated potent inhibitory activity (IC50 = 0.8 nM) of cAMP production in A2AR-HEK293 cells and strong binding affinity (Ki = 0.6-21 nM) against A1/A2A/A2B receptors. Compound 14a also effectively restored T cell proliferation suppressed by 5\u0027-N-ethylcarboxamidoadenosine (NECA) and exhibited superior T cell-mediated cytotoxicity in coculture systems with A1R- and PD-L1-expressed cancer cells compared with ciforadenant (A2AR antagonist) and etrumadenant (A2AR/A2BR dual antagonist). Moreover, the combination of compound 14a with avelumab, an anti-PD-L1 antibody, resulted in enhanced infiltration of effector T cells and significantly increased the CD8+/Treg ratio in the CT26 syngeneic mouse model, substantially inhibiting tumor growth. Therefore, compound 14a is a promising candidate for multitargeted immunomodulation in cancer immunotherapy.",
    "214":  "Triple-negative breast cancer (TNBC) remains a leading cause of cancer-related mortality in women, characterized by its aggressive nature and limited therapeutic options. TNBC is defined by the absence of estrogen receptor (ER), progesterone receptor (PR), and human epidermal growth factor receptor 2 (HER2) expression, which excludes patients from targeted endocrine and HER2-directed therapies, contributing to poor prognosis. This study investigates BKS-112, a potent histone deacetylase 6 (HDAC6) inhibitor, for its anticancer activity against TNBC using MDA-MB-231 cells. We assessed HDAC protein expression and their prognostic implications, alongside in vitro experiments analyzing cell viability, apoptosis, autophagy, and colony formation. BKS-112 exhibited dose- and time-dependent reductions in cell viability, significant morphological alterations, and decreased colony formation. The compound increased the acetylation of histones H3, H4, and α-tubulin while downregulating HDAC6 expression and activity. Additionally, BKS-112 reduced cell migration, demonstrating anti-metastatic potential. It induced G1 phase cell cycle arrest and modulated key regulators, including cyclins and cyclin-dependent kinases (CDKs). Apoptosis was promoted through mitochondrial pathways, evidenced by changes in Bcl-2, Bax, and caspase activation. BKS-112 also elevated reactive oxygen species (ROS) levels, affecting apoptosis-related PI3K/AKT signaling. Autophagy was triggered by upregulating LC3 and Atg-7 expression. Collectively, these findings suggest that BKS-112 exerts robust anticancer effects by inducing cell cycle arrest, apoptosis, and autophagy, highlighting its therapeutic promise for TNBC treatment.",
    "213":  "Distinct reaction modes of π-allylruthenium complexes, derived from allylic acetals, in the urazole-directed C-H/N-H annulation are described. By controlling the reaction conditions, electrophilic addition of π-allylruthenium complexes at the α- and γ-positions was selectively achieved, resulting in the formation of dihydrocinnolines and benzodiazepines, respectively. A series of control experiments for plausible reaction mechanism were performed.",
    "212":  "Functionalized carbolines play a crucial role in the discovery of bioactive compounds and functional materials. In this study, we report a Rh(III)-catalyzed annulative synthesis of γ-carbolines from indolyl azines and internal alkynes. Remarkably, indolyl azines can undergo N-N bond cleavage under the influence of a Rh(III) catalyst, yielding 2-fold ketimines, which demonstrates the atom economy of indolyl azines in catalytic C-H functionalizations. A series of post-transformations for the synthesized products are also described.",
    "209":  "Hepatitis B virus (HBV) is a leading cause of chronic hepatitis and remains a significant global public health concern due to the lack of effective treatments. HBV replicates through reverse transcription within the viral capsid, making capsid assembly a promising antiviral target. However, no approved therapies currently target this process. In our previous study, we optimized the structure-activity relationship (SAR) of NVR 3-778 by modifying the A and B rings, leading to the identification of KR-26556 and Compound 3. In this study, we further synthesized derivatives to modify the C ring, resulting in the discovery of KR019 and KR026. These compounds exhibited over 170-fold higher selectivity than the reference compound while demonstrating potent antiviral activity in HBV-replicating cells. Mechanistic studies revealed that KR019 binds to the hydrophobic pocket at the core protein dimer-dimer interface, misdirecting capsid assembly into genome-free capsids and thereby inhibiting viral replication. Additionally, pharmacokinetic profiling confirmed favorable stability and safety. These findings highlight the strong antiviral potential of KR019 and KR026 and provide a foundation for further in vivo investigation.",
    "208":  "Transition-metal-catalyzed aminometalation of o-alkynylanilines is a promising pathway for the synthesis of C3-functionalized indoles. Herein, we describe the Cu(II)-catalyzed site-selective C3-heteroarylation of indoles from o-alkynylanilines and quinoline N-oxides. A plausible reaction mechanism involving the aminocupration of o-alkynylanilines followed by the nucleophilic addition of Cu(II)-indolyl complexes to quinoline N-oxides was proposed. Post-transformations of the generated C3-heteroarylated indoles demonstrated the broad applicability of the developed method.",
    "206":  "GPR119 has emerged as a promising target for treating type 2 diabetes and associated obesity, as its stimulation induces the secretion of glucagon-like peptide-1 and glucose-dependent insulinotropic peptide in the intestinal tract as well as the glucose-dependent release of insulin in pancreatic β-cells. We describe the design and synthesis of novel GPR119 agonists containing a 1,4-disubstituted cyclohexene scaffold. Compound 21b displayed nanomolar potency (EC50 = 3.8 nM) for hGPR119 activation and demonstrated a hypoglycemic efficacy of 17.0% in an oral glucose tolerance test. The hypoglycemic effect of compound 21b, compared to sitagliptin, a DPP-4 inhibitor, showed the relatively higher efficacy in both FATZO and db/db mice. Additionally, compound 21b exhibited a significant reduction in body weight in a female diet-induced obese rat model, comparable to that of metformin. Furthermore, in vivo pharmacokinetic experiments revealed that compound 21b is a potential candidate for the treatment of type 2 diabetes and obesity.",
    "204":  "The synthesis of (iso)quinoline-indole hybrids by reacting (iso)quinoline N-oxides with o-alkynylanilines in the presence of a combination of copper(II) catalyst and a bidentate 2,2\u0027-bipyridine ligand is described. The utility of this method was demonstrated through site-selective functionalization of the synthesized products. A plausible reaction pathway for site-selective amination followed by annulative indole formation was elucidated by a series of mechanistic investigations.",
    "203":  "The development of novel directing groups is a valuable strategy to secure the advancement of catalytic C-H functionalization. To illustrate the feasibility of urazoles as heterocyclic directing groups, we herein present the ruthenium(II)-catalyzed annulation of N-H/C-H bonds on N-aryl urazoles with vinylene carbonate. This transformation provides the rapid construction of triazolocinnoline derivatives as hemiaminal and dehydrated forms. A series of mechanistic investigations and post-transformations highlighted the amenability of the developed method.",
    "202":  "Sulfur-containing organic molecules are recognized as promising candidates for catalytic C-H functionalization and medicinal chemistry owing to the exceptional ability of the sulfur atom to bind to transition metals and target enzymes. In this study, we report the Rh(III)-catalyzed thione-directed C-H amidation of various thiochromone analogues derived from flavones, isoflavones, and xanthones. Post-transformations of C5-amidated thiochromone products were investigated, and a series of mechanistic studies were performed.",
    "201":  "Macaranga denticulata (MD) bark is commonly utilized in traditional medicine for diabetes prevention and treatment. The bark extract of MD is rich in prenyl or farnesyl flavonoids and stilbenes, which possess antioxidant properties. Although data suggest the potential therapeutic benefits of the use of MD in treating diabetic nephropathy (DN), the precise mechanisms underlying MD-initiated protective effects against DN are not well understood. This study aimed to assess the renoprotective properties of MD extract by examining renofibrosis inhibition, oxidative stress, and inflammation utilizing streptozotocin-induced DN male Sprague - Dawley rats. Diabetic rats were intraperitoneally injected with streptozotocin (STZ) to induce diabetes. After 6 days, these rats were orally administered MD extract (200 mg/kg/day) or metformin (200 mg/kg/day) for 14 days. The administration of MD extract significantly lowered blood glucose levels, restored body weight, and reduced urine levels of various biomarkers associated with kidney functions. Histopathological analysis revealed protective effects in both kidneys and pancreas. Further, MD extract significantly restored abnormalities in advanced glycation end products, oxidative stress biomarkers, and proinflammatory cytokine levels in STZ-treated rats. MD extract markedly reduced renal fibrosis biomarker levels, indicating recovery from renal injury, and reversed dysregulation of sirtuins and claudin-1 in the kidneys of rats with STZ-induced diabetes. In conclusion, data demonstrated the renoprotective role of MD extract, indicating plant extract\u0027s ability to suppress oxidative stress and regulate proinflammatory pathways during pathological changes in diabetic nephropathy.",
    "200":  "Indole derivatives exhibit a broad spectrum of beneficial effects, encompassing anti-inflammatory, antiviral, antimalarial, anti-diabetic, antioxidant, anti-hepatitis, and antidepressant properties. Here, we describe the potentiation of insulin secretion in pancreatic islets and INS-1 cells through methyl 2-(2-ethoxy-1-hydroxy-2-oxoethyl)-1-(pyrimidine-2-yl)-1H-indole-3-carboxylate (HI 129), a novel indole derivative. Treatment with HI 129 led to notably decreased ADP/ATP ratios in pancreatic islets and INS-1 cells compared to those in the vehicle-treated controls, indicating a shift in cellular ATP production. Moreover, the augmentation of insulin secretion by HI 129 was closely correlated with its ability to enhance the mitochondrial membrane potential and respiration, partly by reducing the phosphorylation levels of AMP-activated protein kinase (AMPK). Mechanistically, HI 129 enhanced the association between AMPK and β-arrestin-1, critical molecules for glucose-induced insulin secretion. Furthermore, β-arrestin-1 depletion attenuated the effect of HI 129 on glucose-induced insulin secretion, suggesting that HI 129 potentiates insulin secretion via β-arrestin-1/AMPK signaling. These results collectively underscore the potential of HI 129 in enhancing insulin secretion as a novel candidate for improving glucose homeostasis in type 2 diabetes.",
    "198":  "Hepatocellular carcinoma (HCC) is the most common type of liver cancer and is responsible for 90% of cases. Approximately 30% of patients diagnosed with HCC are identified as displaying an aberrant expression of fibroblast growth factor 19 (FGF19)-fibroblast growth factor receptor 4 (FGFR4) as an oncogenic-driver pathway. Therefore, the control of the FGF19-FGFR4 signaling pathway with selective FGFR4 inhibitors can be a promising therapy for the treatment of HCC. We herein disclose the design and synthesis of novel FGFR4 inhibitors containing a 2,6-naphthyridine scaffold. Compound 11 displayed a nanomolar potency against Huh7 cell lines and high selectivity over FGFR1-3 that were comparable to that of fisogatinib (8) as a reference standard. Additionally, compound 11 demonstrated remarkable antitumor efficacy in the Huh7 and Hep3B HCC xenograft mouse model. Moreover, bioluminescence imaging experiments with the orthotopic mouse model support that compound 11 can be considered a promising candidate for treating HCC.",
    "194":  "Site-selective functionalization of saturated N-heterocycles such as pyrrolidines is a central topic in organic synthesis and drug discovery. We herein report the sulfur-assisted rhodium(III)-catalyzed sp3 C-H amidation of pyrrolidines with dioxazolones as amidating agents. The amenability of the thioamide directing group is elucidated by a series of control experiments.",
    "193":  "The site-selective modification of quinazolinone as a privileged bicyclic N-heterocycle is an attractive topic in medicinal chemistry and material science. We herein report the ruthenium(II)-catalyzed C-H allylation of 2-aryl quinazolinones with 2-methylidene cyclic carbonate. In addition, tandem C-H allylation and annulation are achieved under rhodium(III) catalysis, resulting in the formation of tetracyclic quinazolinones including a tertiary carbon center. Post-transformations of the synthesized products demonstrate the potential of the developed methodology. A series of mechanistic investigations were also performed.",
    "192":  "Epidermal growth factor receptor (EGFR)-targeted therapy is used to treat EGFR mutation-induced non-small cell lung cancer (NSCLC). However, its efficacy does not last beyond a certain period due to the development of primary and secondary resistance. First and second-generation inhibitors (e.g., gefitinib, erlotinib, and afatinib) induce EGFR T790M mutations, while third-generation inhibitors (e.g., osimertinib) induce C797S as a major target resistance mutation. Therefore, the C797S mutation is being actively researched. In this study, we investigated the structure-activity relationship of several synthesized compounds as fourth-generation inhibitors against the C797S mutation. We identified a compound 13k that displayed nanomolar potency and high selectivity. Moreover, we used a triple mutant xenograft mouse model to evaluate the in vivo efficacy of 13k in inhibiting EGFR C797S, which demonstrated exceptional profiles and satisfactory EGFR C797S inhibition efficacy. Based on its excellent in vitro and in vivo profiles, compound 13k can be considered a promising candidate for treating EGFR C797S mutations.",
    "191":  "The synthesis of functionalized carbazoles as privileged nitrogen heterocycles has emerged as a central topic in drug discovery and material science. We herein disclose the rhodium(III)-catalyzed cross-coupling reaction between indolyl nitrones and 2-methylidene cyclic carbonate as an allylating surrogate, resulting in the formation of C2-formylated carbazoles via tandem C-H allylation, [3 + 2] cycloaddition, aromatization, and benzylic oxidation. The synthetic utility of this protocol is highlighted by a variety of post-transformations of C2-formylated carbazoles.",
    "189":  "Since sirtuins (SIRTs) are closely associated with reactive oxygen species (ROS) and antioxidant system, the development of their selective inhibitors is drawing attention for understanding of cellular redox homeostasis. Here, we describe the pharmacological properties of SPC-180002, which incorporates a methyl methacrylate group as a key pharmacophore, along with its comprehensive molecular mechanism as a novel dual inhibitor of SIRT1/3. The dual inhibition of SIRT1/3 by SPC-180002 disturbs redox homeostasis via ROS generation, which leads to an increase in both p21 protein stability and mitochondrial dysfunction. Increased p21 interacts with and inhibits CDK, thereby interfering with cell cycle progression. SPC-180002 leads to mitochondrial dysfunction by inhibiting mitophagy, which is accompanied by a reduction in oxygen consumption rate. Consequently, SPC-180002 strongly suppresses the proliferation of cancer cells and exerts anticancer effect in vivo. Taken together, the novel SIRT1/3 dual inhibitor, SPC-180002, impairs mitochondrial function and redox homeostasis, thereby strongly inhibiting cell cycle progression and cancer cell growth.",
    "188":  "Astilbe chinensis (A. chinensis) is a perennial herb that is used to treat chronic bronchitis and pain. The anticancer activity of 3β,6β‑dihydroxyurs‑12‑en‑27‑oic acid (ACT‑3), a major component isolated from A. chinensis, has not yet been investigated in detail. The purpose of the present study was to investigate the histone deacetylase (HDAC) inhibitory and anticancer activities of ACT‑3 compared with suberoylanilide hydroxamic acid (SAHA) in MCF‑7 human breast cancer cells. The purity of ACT‑3 was determined using high‑performance liquid chromatography. In the present study, the effects of ACT‑3 on anticancer effects of MCF‑7 cells were determined by measuring the level of apoptotic cell death and cell cycle regulator using flow cytometry analysis and western blot analysis, respectively. The effects of ACT‑3 on HDAC enzyme activity were measured using assay kits. ACT‑3 and SAHA increased the levels of acetylated histone H3 and reduced the levels of HDAC1 and HDAC3 in MCF‑7 cells. ACT‑3 significantly decreased the cell viability in a concentration‑dependent manner and induced different morphological changes at high concentrations. ACT‑3 and SAHA significantly inhibited the colony formation in MCF‑7 cells. ACT‑3 inhibited total HDAC activity in a dose‑dependent manner. ACT‑3 significantly reduced the expression levels of cyclin D1 and cyclin‑dependent kinase 4, and upregulated the expression levels of p21WAF1 and p53. A significant increase in the G1 phase cell population was observed in MCF‑7 cells and ACT‑3 induced apoptosis by reducing the ratio of B‑cell lymphoma‑2 (Bcl‑2)/Bcl‑2‑associated X (Bax) and releasing cleaved caspase 9. Additionally, ACT‑3 significantly increased autophagic cell death by inhibiting the serine‑threonine kinase/mammalian target of the rapamycin pathway. Autophagy induction was confirmed via acridine orange staining. ACT‑3 significantly increased the pERK1/2 and p21 in MCF‑7 cells. Thus, the activated ERK pathway played an important role in cell cycle arrest and apoptosis via ERK‑dependent induction of p21 in MCF‑7 cells. These data indicated that ACT‑3 can be used as a promising anticancer agent to overcome the limitations and reduce the side effects of conventional anticancer drugs.",
    "187":  "Concise synthesis of ent-conduramine C-1 and its derivatives has been achieved by using commercially available d-ribose. The key steps in the synthesis are regioselective and diastereoselective amination of polybenzyl ethers by chlorosulfonyl isocyanate (CSI), chelation-controlled carbonyl addition, and intramolecular olefin metathesis. All of the synthesized compounds were evaluated for inhibitory activity against α-glucosidase. The derivatives 18 (IC50 = 0.65 ± 0.03 mM) and 19 (IC50 = 0.26 ± 0.01 mM) were identified to be more potent than well-known α-glucosidase inhibitor acarbose (IC50 = 1.05 ± 0.17 mM) as a positive control.",
    "186":  "The combination of a quinone-ascorbic acid organic redox reaction and a concomitant copper catalysis in situ enables new approach to hydroxybenzofurans with structural variations.",
    "185":  "Pyruvate kinase M2 (PKM2) is a key enzyme involved in the regulation of glycolysis. Although PKM2 is overexpressed in various tumor tissues, its functional role in cancer chemotherapy remains unexplored. In this study, we investigated the anticancer activity of a new PKM2 inhibitor, compound 3h, through the cell metabolism and associated signaling pathways in prostate cancer cells. To evaluate the molecular basis of specific PKM2 inhibitors, the interactions of compounds 3h and 3K with the PKM2 protein were assessed via molecular docking. We found that, compared to compound 3K, compound 3h exhibited a higher binding affinity for PKM2. Moreover, compound 3h significantly inhibited the pyruvate kinase activity and PKM2 expression. Cytotoxicity and colony formation assays revealed the potent anticancer activity of compound 3h against LNCaP cells. Compound 3h significantly increased the apoptotic and autophagic cell death in LNCaP cells. In addition, compound 3h induced AMPK activation along with the inhibition of the mTOR/p70S6K pathway. Furthermore, compound 3h significantly inhibited glycolysis and mitochondrial respiration, as determined by analyzing the extracellular acidification rate (ECAR) and oxygen consumption rate (OCR) production. Our results revealed that compound 3h caused apoptotic and autophagic cell death in LNCaP cells by inhibiting cancer cell metabolism. Therefore, blocking glycolytic pathways using specific PKM2 inhibitors can target cancer cell metabolism in PKM2-overexpressed prostate cancer cells.",
    "184":  "The site-selective incorporation of a trifluoromethyl group into biologically active molecules and pharmaceuticals has emerged as a central topic in medicinal chemistry and drug discovery. Herein, we demonstrate the rhodium(III)-catalyzed conjugate addition of β-trifluoromethylated enones with quinoline N-oxides, which result in the generation of β-trifluoromethyl-β\u0027-quinolinated ketones. The reaction proceeds under mild conditions with complete functional group tolerance. The synthetic applicability was showcased by successful gram-scale experiments and valuable synthetic transformations of coupling products.",
    "182":  "The straightforward and rapid incorporation of a thiazolidinedione scaffold into prefunctionalized (hetero)aromatic compounds is in demand for the development of antidiabetic glitazones and other pharmaceuticals. Herein, we report the unprecedented N- and O-directed C-H alkylation of various (hetero)arenes with methylene thiazolidinediones under rhodium(III) catalysis. The applicability of the developed protocol in challenging contexts is exhibited by the late-stage installation of a methylene thiazolidinedione moiety on the C-H bond of commercially available drug molecules. Combined mechanistic investigations aided the elucidation of a plausible reaction mechanism.",
    "181":  "High-fat diet (HFD)-induced obesity has been involved in the development of diabetic nephropathy (DN). Tenovin-1, a potent selective SIRT1/2 inhibitor, regulates various target proteins. The present study evaluated the protective effect of Tenovin-1 against renal fibrosis in HFD-induced Zucker diabetic fatty (ZDF) rats. Rats were fed a normal chow diet or HFD. Tenovin-1 (45 mg/kg) administered to HFD-fed rats decreased inflammatory cytokine expression in the serum of the rats. The antioxidant status and oxidative damage to lipids or DNA were significantly restored by Tenovin-1. Additionally, Tenovin-1 reduced the levels of blood urea nitrogen (BUN), serum creatinine (sCr), microalbumin, and urinary protein-based biomarkers in the urine of HFD-fed rats. The abnormal architecture of the kidney and pancreas was restored by Tenovin-1 administration. Tenovin-1 also reduced apoptosis in the kidneys of the HFD-fed rats and HG-treated NRK-52E cells. It significantly lowered the levels of ECM proteins in the kidneys of HFD-fed rats and HG-treated NRK-52E cells. Additionally, Tenovin-1 markedly reduced claudin-1, SIRT1, and SIRT2, but increased SIRT3 and SIRT4 in HFD-fed rats and NRK-52E cells treated with HG. Furthermore, Tenovin-1 altered epidermal growth factor receptor (EGFR), platelet-derived growth factor receptor-β (PDGFR-β), and signal transducer and activator of transcription 3 (STAT3) levels in the kidneys of HFD-fed rats. Conclusively, this study shows that Tenovin-1 can be a potential candidate drug for the treatment of HFD-induced renal fibrosis, in vivo and in vitro models.",
    "180":  "The ruthenium(II)-catalyzed tandem C-H allylation and intramolecular dipolar cycloaddition between azomethine imines and 2-methylidenetrimethylene carbonate is described herein. The initially formed β-substituted allyl fragment could trigger the exotype [3 + 2] cycloaddition with the polar azomethine group, resulting in the formation of bridged tetracycles bearing a hydroxymethylene group at a bridgehead carbon center. A wide substrate scope and broad functional group compatibility were observed. The gram-scale synthesis and synthetic transformations demonstrate the synthetic utility of this process.",
    "179":  "In this study, we examine the site-selctive iridium(III)-catalyzed C-H amidation between 2-aryl azlactones and acyl azides. This transformation produces a range of ortho-amidated azlactones, which act as precursors for the synthesis of chiral amino acids via organocatalyzed ring-opening reactions. To test its effectiveness, the method developed is applied to the late-stage C-H amidation of complex drug molecules. The isolation of an iridacycle species supports a proposed reaction pathway.",
    "178":  "Molineria recurvata (MR) has been traditionally used to manage diabetes mellitus in India. However, the molecular mechanism of MR on the diabetic-induced nephropathy has not been clearly investigated. Thus, this study investigates the protective effects of the MR extract on nephropathy in streptozotocin (STZ)-induced diabetic rats. Diabetes was instigated by a single intraperitoneal injection of STZ (45 mg/kg) in male Sprague-Dawley rats. Once the diabetes was successfully induced, the MR extract (200 mg/kg/day) or metformin (200 mg/kg/day) was orally administered for 14 days. Renal function, morphology changes and levels of inflammatory cytokines were measured. Blood glucose concentrations were considerably reduced in STZ-induced diabetic rats following treatment with the MR extract. The administration of the MR extract substantially restored the abnormal quantity of the oxidative DNA damage marker 8-hydroxy-2\u0027-deoxy-guanosine (8-OHdG), malondialdehyde, glutathione, oxidized glutathione, superoxide dismutase, catalase, interleukin (IL)-1β, IL-6, IL-10, and transforming growth factor-β (TGF-β). The urinary excretion of kidney injury molecule-1 (KIM-1), neutrophil gelatinase-associated lipocalin (NGAL), selenium binding protein 1 (SBP1), and pyruvate kinase M2 (PKM2) was significantly reduced in diabetes rats after administration of the MR extracts. In the kidneys of STZ-induced diabetic rats, the MR extracts markedly downregulated the expression of fibronectin, collagen-1, and α-smooth muscle actin (α-SMA). In particular, the MR extracts markedly increased the level of SIRT1 and SIRT3 and reduced claudin-1 in the kidney. These results suggest that the MR extracts exhibits therapeutic activity in contrast to renal injury in STZ-induced diabetic rats through repressing inflammation and oxidative stress.",
    "171":  "Indole derivatives from various plants are known to have health benefits because of their anti-cancer, anti-oxidant, anti-inflammatory, and anti-tubercular effects. However, their effects on adipogenesis have not been fully elucidated yet. Herein, we show that a newly synthesized indole derivative, CF3-allylated indole, [(E)-1-(pyrimidin- 2-yl)-2-(4,4,4- trifluorobut-2-enyl)-1H-indole], effectively inhibits adipogenesis. We found that CF3-allylated indole inhibited lipid accumulation and suppressed the expression of CCAAT/enhancer-binding protein α (C/EBPα) and peroxisome proliferator activated receptor γ (PPARγ) in 3T3-L1 cells. The inhibitory effect of CF3-allylated indole primarily occurred at the early phase of adipocyte differentiation by increasing intracellular cyclic adenosine monophosphate (cAMP) levels and enhancing protein kinase A (PKA) and adenosine monophosphate-activated protein kinase (AMPK) signaling. Conversely, depletion of PKA or treatment with a protein kinase A inhibitor (H89) reversed such inhibitory effects of CF3-allylated indole on adipogenesis and PPARγ expression. These results suggest that CF3-allylated indole inhibits early stages of adipogenesis by increasing phosphorylation of PKA/AMPK, leading to decreased expression of adipogenic genes in 3T3-L1 cells. These results indicate that CF3-allylated indole has potential for controlling initial adipocyte differentiation in metabolic disorders such as obesity.",
    "168":  "The rhodium(III)-catalyzed spiroannulation reaction between N-aryl indazol-3-ols and maleimides is described herein. The developed method is showcased by the construction of spirosuccinimides using bioactive molecule-linked and chemical probe-linked maleimides. Combined mechanistic investigations including the determination of an isolable rhodacycle complex aided the elucidation of a plausible reaction mechanism.",
    "166":  "The direct functionalization of N-heterocycles is a vital transformation for the development of pharmaceuticals, functional materials, and other chemical entities. Herein, the transition-metal-free alkylation and acylation of C(sp2)-H bonds in biologically relevant 2-benzoxazinones with 1,4-dihydropyridines as readily accessible radical surrogates is described. Excellent functional group compatibility and a broad substrate scope were attained. Gram-scale reaction and transformations of the synthesized adducts via Suzuki coupling with heteroaryl boronic acids demonstrated the synthetic potential of the developed protocol.",
    "164":  "Abstract Herein, we report a simple and straightforward catalyst‐free one‐pot multi‐component synthesis of quinazolin‐4‐carboxamides using 2‐(2‐aminophenyl)‐ N , N ‐dialkyl‐2‐oxoacetamide, aldehydes and ammonium acetate. As compared to the conventional approached for quinazolin‐4‐carboxamides synthesis, this transformation demonstrates very good reactivity by tolerating a large number of functional groups, and proceeds with good to moderate yields under mild conditions. Notably, the synthesized 6‐bromoquinazolin‐4‐carboxamide was subjected to Suzuki‐Miyaura cross‐coupling and Buchwald‐Hartwig C−N bond forming reactions providing a straightforward method to obtain structurally diverse and valuable quinazoline scaffolds. Furthermore, the reaction could be easily scaled up to gram scale.",
    "163":  "The success of cancer chemotherapy is limited by multidrug resistance (MDR), which is mainly caused by P-glycoprotein (P-gp) overexpression. In the present study, we describe a novel microtubule inhibitor, 5-(N-methylmaleimid-3-yl)-chromone (SPC-160002), that can be used to overcome MDR. A synthetic chromone derivative, SPC-160002, showed a broad spectrum of anti-proliferative effects on various human cancer cells without affecting P-gp expression and its drug efflux function. Treatment with SPC-160002 arrested the cell cycle at the M phase, as evidenced using fluorescence-activated cell sorting analysis, and increased the levels of mitotic marker proteins, including cyclin B, pS10-H3, and chromosomal passenger complex. This mitotic arrest by SPC-160002 was mediated by promoting and stabilizing microtubule polymerization, similar to the mechanism observed in case of taxane-based drugs. Furthermore, SPC-160002 suppressed the growth and sphere-forming activity of cancer stem cells. Our data herein strongly suggest that SPC-160002, a novel microtubule inhibitor, can be used to overcome MDR and can serve as an attractive candidate for anticancer drugs.",
    "160":  "Fibroblast activation protein (FAP) belongs to the family of prolyl-specific serine proteases and displays both exopeptidase and endopeptidase activities. FAP expression is undetectable in most normal adult tissues, but is greatly upregulated in sites of tissue remodeling, which include fibrosis, inflammation and cancer. Due to its restricted expression pattern and dual enzymatic activities, FAP inhibition is investigated as a therapeutic option for several diseases. In the present study, we described the structure-activity relationship of several synthesized compounds against DPPIV and prolyl oligopeptidase (PREP). In particular, BR102910 (compound 24) showed nanomolar potency and high selectivity. Moreover, the in vivo FAP inhibition study of BR102910 (compound 24) using C57BL/6J mice demonstrated exceptional profiles and satisfactory FAP inhibition efficacy. Based on excellent in vitro and in vivo profiles, the potential of BR102910 (compound 24) as a lead candidate for the treatment of type 2 diabetes is considered.",
    "155":  "There is a recognized need in the area of explosives detection for fluorescence-based sensing systems that are capable of not only producing a turn-on response but also generating a distinctive spectral signature for a given analyte. Here, we report several supramolecular ensembles displaying efficient fluorophore displacement that give rise to an increase in fluorescence intensity upon exposure to various nitroaromatic compounds. The synthetic supramolecular constructs in question consist of a tetrathiafulvalene (TTF)-based pyrrolic macrocycle, benzo-TTF-calix[4]pyrrole (Bz-TTF-C4P), and fluorescent dyes, monomeric or dimeric naphthalenediimide (NDI) and perylenediimide (PDI) derivatives, as well as chloride or hexafluorophosphate (PF6-) salts of rhodamine 6G (Rh-6G). In chloroform solution, these assemblies exist in the form of discrete supramolecular complexes or oligomeric aggregates depending on the specific dye combinations in question. Each ensemble was tested as a potential explosive-responsive fluorescence indicator displacement assay (FIDA) by challenging it with a series of di- and trinitroaromatic compounds and examining the change in fluorescence spectral characteristics. Upon addition of nitroaromatic compounds (NACs), either a \"turn-on\" or a \"turn-off\" fluorescent response was observed depending on the nature of the constituent fluorophore and, where applicable, the counteranion. The FIDAs based on the PDI derivatives were found to display not only a ratiometric fluorescence enhancement but also analyte-dependent spectral changes when treated with NACs. The NAC-induced fluorescence spectral response of each ensemble was rationalized on the basis of various solution-phase spectroscopic studies, as well as single-crystal X-ray diffraction analyses.",
    "153":  "Renal cell carcinoma has emerged as one of the leading causes of cancer-related deaths in the USA. Here, we examined the anticancer profile of oxindole derivatives (SH-859) in human renal cancer cells. Targeting 786-O cells by SH-859 inhibited cell growth and affected the protein kinase B/mechanistic target of rapamycin 1 pathway, which in turn downregulated the expression of glycolytic enzymes, including lactate dehydrogenase A and glucose transporter-1, as well as other signaling proteins. Treatment with SH-859 altered glycolysis, mitochondrial function, and levels of adenosine triphosphate and cellular metabolites. Flow cytometry revealed the induction of apoptosis and G0/G1 cell cycle arrest in renal cancer cells following SH-859 treatment. Induction of autophagy was also confirmed after SH-859 treatment by acridine orange and monodansylcadaverine staining, immunocytochemistry, and Western blot analyses. Finally, SH-859 also inhibited the tumor development in a xenograft model. Thus, SH-859 can serve as a potential molecule for the treatment of human renal carcinoma.",
    "152":  "A synthetic route to liphagal, a natural PI3Kα inhibitor isolated from Aka coralliphaga, was established. The present route features an organic redox process where an alkynylquinone undergoes reductive cyclization in the presence of a hydroquinone derivative such as hydroxyquinol (1,2,4-benzenetriol) and catalytic PdCl2 to provide a substituted benzofuran suitable for accessing the natural product. The benzofuran formation takes place via the redox transformation between the alkynylquinone and the electron-rich hydroquinones followed by the concomitant Pd(II)-catalyzed oxycyclization of the resultant alkynylhydroquinone.",
    "150":  "A series of novel quinoxaline derivatives were synthesized and evaluated for their inhibitory activity against c-Met kinase enzyme. Most of the tested compounds exhibited potent inhibitory activity. All the synthesized quinoxaline compounds were further examined against c-Met overexpressed human gastric cancer cell line (MKN-45), which showed good inhibitory activity. Among the synthesized compounds, compound 4 exhibited better tumor growth inhibition in the animal model study; we also confirmed its acceptable drug property and highly selective target activity.",
    "149":  "Sirtuin (SIRT) is known to prevent nonalcoholic fatty liver disease (NAFLD); however, the role of SIRT4 in the progression of hepatic fibrosis remains unknown. We hypothesize that EX-527, a selective SIRT1 inhibitor, can inhibit the progression of high-fat diet (HFD)-induced hepatic fibrosis. We found that SIRT4 expression in the liver of NAFLD patients is significantly lower than that in normal subjects. In this study, EX-527 (5 µg/kg), administered to HFD rats twice a week for ten weeks, reduced the serum levels of triglyceride (TG), total cholesterol, alanine aminotransferase (ALT), and aspartate aminotransferase (AST) and attenuated hepatic fibrosis evidenced by Masson\u0027s trichrome and hepatic fat by oil red-O staining. EX-527 upregulated SIRT2, SIRT3, and SIRT4 expression in the liver of HFD fed rats but downregulated transforming growth factor-β1 (TGF-β1) and α-smooth muscle actin (α-SMA) expression. It decreased proinflammatory cytokine production and hydroxyproline levels in the serum and SMAD4 expression and restored apoptotic protein (Bcl-2, Bax, and cleaved caspase-3) expression. These data propose a critical role for the SIRT4/SMAD4 axis in hepatic fibrogenesis. SIRT4 upregulation has the potential to counter HFD-induced lipid accumulation, inflammation, and fibrogenesis. We demonstrate that EX-527 is a promising candidate in inhibiting the progression of HFD-induced liver fibrosis.",
    "147":  "A transition-metal-free deoxygenative C-H amination reaction of azine-N-oxides with acyl azides is described. The initial formation of an isocyanate from the starting acyl azide via a Curtius rearrangement can trigger a [3 + 2] dipolar cycloaddition of polar N-oxide fragments to generate the aminated azine derivative. The applicability of this method is highlighted by the late-stage and sequential amination reactions of complex bioactive compounds, including quinidine and fasudil. Moreover, the direct transformation of aminated azines into various bioactive N-heterocycles illustrates the significance of this newly developed protocol.",
    "146":  "-aryl phthalazinones with a range of aldehydes and activated ketone is described. Initial formation of hydroxyalkylated phthalazinones and subsequent Mitsunobu cyclization provided facile access to biologically relevant indazolophthalazinones. The utility of this method is highlighted by synthetic transformations into a series of potentially bioactive scaffolds.",
    "144":  "Use of the chemotherapeutic agent cisplatin (CDDP) in cancer patients is limited by the occurrence of acute kidney injury (AKI); however, no protective therapy is available. We aimed to investigate the renoprotective effects of Dendropanax morbifera water extract (DM) on CDDP-induced AKI. Male Sprague-Dawley rats (six animals/group) received: Vehicle (control); CDDP (6 mg/kg, intraperitoneally (i.p.); DM (25 mg/kg, oral); or DM + CDDP injection. CDDP treatment significantly increased blood urea nitrogen (BUN), serum creatinine (sCr), and pro-inflammatory cytokines (IL-6 and TNF-α), and severely damaged the kidney architecture. Urinary excretion of protein-based AKI biomarkers also increased in the CDDP-treated group. In contrast, DM ameliorated CDDP-induced AKI biomarkers. It markedly protected against CDDP-induced oxidative stress by increasing the activity of endogenous antioxidants and reducing the levels of pro-inflammatory cytokines (IL-6 and TNF-α). The protective effect of DM in the proximal tubules was evident upon histopathological examination. In a tumor xenograft model, administration of DM enhanced the chemotherapeutic activity of CDDP and exhibited renoprotective effects against CDDP-induced nephrotoxicity without altering chemotherapeutic efficacy. Our data demonstrate that DM may be an adjuvant therapy with CDDP in solid tumor patients to preserve renal function.",
    "143":  "The synthesis of alkylated diazine derivatives is important for their practical utilization as pharmaceuticals and for other purposes. Herein, we describe the metal-free site-selective C-H alkylation of diazine N-oxides using phosphonium ylides that affords a variety of alkylated diazine derivatives with broad functional group tolerance. The utility of this method is showcased by the late-stage functionalization of a commercially available drug such as varenicline. Notably, the sequential C-H alkylation of pyrazine N-oxides for the total synthesis of a pyrazine-containing natural product, paenibacillin A, highlights the importance of this method.",
    "142":  "Hepatic fibrosis is characterized by persistent deposition of extracellular matrix proteins and occurs in chronic liver diseases. The aim of the present study is to investigate whether estrogen deficiency (ED) potentiates hepatic fibrosis in a thioacetamide (TAA)-treated rat model. Fibrosis was induced via intraperitoneal injection (i.p.) of TAA (150 mg/kg/day) for four weeks in ovariectomized (OVX) female, sham-operated female, or male rats. In TAA-treated OVX rats, the activities of serum alanine aminotransferase (ALT), aspartate aminotransferase (AST), alkaline phosphatase (ALP), and γ-glutamyl transferase (GGT) were significantly increased compared to those in TAA-treated sham-operated OVX rats or TAA-treated male rats. Furthermore, α-smooth muscle actin (α-SMA) expression was significantly increased compared to that in TAA-treated sham-operated rats. This was accompanied by the appearance of fibrosis biomarkers including vimentin, collagen-I, and hydroxyproline, in the liver of TAA-treated OVX rats. In addition, ED markedly reduced total glutathione (GSH) levels, as well as catalase (CAT) and superoxide dismutase (SOD) activity in TAA-treated OVX rats. In contrast, hepatic malondialdehyde (MDA) levels were elevated in TAA-treated OVX rats. Apoptosis significantly increased in TAA-treated OVX rats, as reflected by elevated p53, Bcl-2, and cleaved caspase 3 levels. Significant increases in interleukin-6 (IL-6) and tumor necrosis factor-α (TNF-α) concentrations were exhibited in TAA-treated OVX rats, and this further aggravated fibrosis through the transforming growth factor-β (TGF-β)/Smad pathway. Our data suggest that ED potentiates TAA-induced oxidative damage in the liver, suggesting that ED may enhance the severity of hepatic fibrosis in menopausal women.",
    "141":  "Previously, we showed that KBV20C cancer cells highly resistant to antimitotic drugs were sensitized by co-treatment with a repositioned drug fluphenazine. Considering that fluphenazine plays a role as a histamine receptor antagonist, we investigated low doses of 21 other histamine receptor antagonists (lidocaine, cimetidine, chlorpromazine, diphenhydramine, promethazine, ranitidine, famotidine, clemastine, chlorpheniramine, desloratadine, loratadine, cyproheptadine, azelastine, brompheniramine, carbinoxamine, fexofenadine, hydroxyzine, levocetirizine, meclizine, nizatidine, and pemirolast) to identify repositioned drugs for their sensitizing effects on antimitotic drug-resistant KBV20C cells at relatively low doses. Co-treatment with loratadine, and with azelastine highly sensitized KBV20C cells to vincristine treatment. Loratadine and azelastine reduced cell viability, increased G2 arrest, and up-regulated apoptosis when co-administered with vincristine. In detailed quantitative analysis, combination of vincristine with loratadine had a higher sensitization effect than that with azelastine. Azelastine had a higher P-glycoprotein (P-gp)-inhibitory activity, similar to that of verapamil, indicating that sensitization by vincristine-azelastine involved the P-gp-inhibitory effects of azelastine. However, loratadine had a very low P-gp-inhibitory activity, suggesting that loratadine sensitization to vincristine is independent of the P-gp-inhibition. Co-treatment with eribulin and loratadine increased the sensitization of KBV20C cells, suggesting that loratadine can be combined with other antimitotic drugs to sensitize resistant cancer cells. These findings provide important information regarding the sensitization of drug-resistant cells and indicate that loratadine may be used in patients with potentially resistant cancer without any toxic effects from P-gp inhibition.",
    "139":  "Pyruvate kinase M2 (PKM2) is essential for aerobic glycolysis. Although high PKM2 expression is observed in various cancer tissues, its functional role in cancer metabolism is unclear. Here, we investigated the role of PKM2 in regulating autophagy and its associated pathways in prostate cancer cells. Immunohistochemistry was performed to compare the expression level of PKM2 in prostate cancer patients and normal human, whereas expression of PKM2 in several cell lines was also examined by using western blot. PKM2 expression was silenced using various small interfering RNAs (siRNAs). Cell viability was examined using IncuCyte ZOOM™ live cell imaging system. Western blotting and immunofluorescence were performed to investigate the PKM2 knockdown on other cellular signaling molecules. Acridine orange and Monodansylcadaverine staining was performed to check effect of PKM2 knockdown on autophagy induction. High performance thin layer chromatography was carried out to quantify the level of different cellular metabolites (pyruvate and lactate). Colony formation assay was performed to determine the ability of a cells to form large colonies. PKM2 was highly expressed in prostate cancer patients as compared to normal human. PKM2 siRNA-transfected prostate cancer cells showed significantly reduced viability. Acridine orange, Monodansylcadaverine staining and western blotting analysis showed that PKM2 downregulation markedly increased autophagic cell death. Results of western blotting analysis showed that PKM2 knockdown affected protein kinase B/mechanistic target of rapamycin 1 pathway, which consequently downregulated the expression of glycolytic enzymes lactate dehydrogenase A and glucose transporter 1. Knockdown of PKM2 also reduced the colony formation ability of human prostate cancer cell DU145. To the best of our knowledge, this is the first study to show that PKM2 inhibition alters prostate cancer cell metabolism and induces autophagy, thus providing new perspectives for developing PKM2-targeting anticancer therapies for treating prostate cancer.",
    "138":  "The ruthenium(II)-catalyzed C-H functionalization of (hetero)aryl azomethine imines with allylic acetals is described. The initial formation of allylidene(methyl)oxoniums from allylic acetals could trigger C(sp2 )-H allylation, and subsequent endo-type [3+2] dipolar cycloaddition of polar azomethine fragments to deliver valuable indenopyrazolopyrazolones. The utility of this method is showcased by the late-stage functionalization of bioactive molecules such as estrone and celecoxib. Combined experimental and computational investigations elucidate a plausible mechanism of this new tandem reaction. Notably, the reductive transformation of synthesized compounds into biologically relevant diazocine frameworks highlights the importance of the developed methodology.",
    "136":  "Hepatic fibrosis, characterized by persistent deposition of extracellular matrix (ECM) proteins, occurs in most types of chronic liver disease. The prevention of liver damage using extract of Dendropanax morbifera has been widely studied, but its molecular mechanism on the therapeutic efficacy of hepatic fibrosis is unclear. The aim of this study was to assess whether aquatic extract (DM) of D. morbifera ameliorates thioacetamide (TAA)-induced hepatic fibrosis. Hepatic fibrosis was induced by an intraperitoneal (i.p.) injection (150 mg/kg, twice per week) of TAA for 6 weeks. DM (50 mg/kg/day) or silymarin (50 mg/kg/day) was administered daily for 6 weeks. DM markedly reduced serum AST, ALT, ALP, and r-GTP in TAA-treated rats. DM significantly ameliorated the total glutathione (GSH), superoxide dismutase (SOD), and catalase (CAT) activity in TAA-treated rats. In particular, DM significantly reduced expression of α-SMA, type I collagen, vimentin, TGF-β1 and p-Smad2/3 in hepatic fibrosis rats. The protective effects of DM on progression of hepatic fibrosis were clearly shown by detecting 4-hydroxyproline concentration and histopathological examination in the liver. Therefore, our data suggest that DM dramatically prevented hepatic fibrosis by inhibiting oxidative stress and the TGF-β1/Smads signaling pathways.",
    "135":  "The facile synthesis of hydroxymethylated indole derivatives is crucial for their further development as pharmaceutical compounds and other synthetic purposes. Herein, we describe the ruthenium(II)-catalyzed hydroxymethylation of indolines and other N-heterocycles using paraformaldehyde as an abundant C1 feedstock. A wide substrate scope range and high levels of site selectivity as well as functional group tolerance were observed.",
    "130":  "We previously discovered a novel sirtuin (SIRT) inhibitor, MHY2256, that exerts anticancer activity through p53 acetylation in MCF-7 human breast cancer cells. We investigated the anticancer activity of MHY2256 against hormone-related cancer, an endometrial cancer with a poor prognosis. The IC50 values of MHY2256 were shown to be much lower than those of salermide, a well-known SIRT inhibitor. Furthermore, MHY2256 significantly reduced the protein expression and activities of SIRT1, 2, and 3, with similar effects to salermide. Particularly, MHY2256 markedly inhibited tumor growth in a tumor xenograft mouse model of Ishikawa cancer cells. During the experimental period, there was no significant change in the body weight of mice treated with MHY2256. A detailed analysis of the sensitization mechanisms of Ishikawa cells revealed that late apoptosis was largely increased by MHY2256. Additionally, MHY2256 increased G1 arrest and reduced the number of cell cyclic-related proteins, suggesting that apoptosis by MHY2256 was achieved by cellular arrest. Particularly, p21 was greatly increased by MHY225656, suggesting that cell cycle arrest by p21 is a major factor in MHY2256 sensitization in Ishikawa cells. We also detected a significant increase in acetylated p53, a target protein of SIRT1, in Ishikawa cells after MHY2256 treatment. In a mouse xenograft model, MHY2256 significantly reduced tumor growth and weight without apparent side effects. These results suggest that MHY2256 exerts its anticancer activity through p53 acetylation in endometrial cancer and can be used for targeting hormone-related cancers.",
    "127":  "The ability to alkylate pyridines and quinolines is important for their further development as pharmaceuticals and agrochemicals, and for other purposes. Herein we describe the unprecedented reductive alkylation of pyridine and quinoline N-oxides using Wittig reagents. A wide range of pyridine and quinoline N-oxides were converted into C2-alkylated pyridines and quinolines with excellent site selectivity and functional-group compatibility. Sequential C-H functionalization reactions of pyridine and quinoline N-oxides highlight the utility of the developed method. Detailed labeling experiments were performed to elucidate the mechanism of this process.",
    "125":  "The transient directing group promoted C(sp2)-H functionalization of benzaldehydes with anthranils by a cationic rhodium(III) catalyst is described. Notably, anthranils have been used as both transient directing groups and amination sources to afford 2-acyl acridines through direct C-H amination followed by acid-mediated cyclization. A range of substrate scopes and functional group tolerance were observed.",
    "121":  "The synthesis and antidiabetic evaluation of ethyl 2-[2,3,4-trimethoxy-6-(1-octanoyl)phenyl]acetate (TMPA) and its structural analogs are described. The construction of TMPA derivatives has been successfully achieved in only two steps, which involve the iridium(III)-catalyzed α-alkylation of acetophenones with alcohols and the ketone-directed iridium(III)- or rhodium(III)-catalyzed redox-neutral C-H alkylation of α-alkylated acetophenones using Meldrum\u0027s diazo compounds. This synthetic protocol efficiently provides a range of TMPA derivatives with site selectivity and functional group compatibility. In addition, the site-selective demethylation of TMPA derivative affords the naturally occurring phomopsin C in good yield. Moreover, all synthetic compounds were screened for in vitro adenosine 5\u0027-monophosphate-activated protein kinase (AMPK) activation using HepG2 cells. Furthermore, TMPA (5ac) and 5cd showing the most potent AMPK activation were treated for the in vivo antidiabetic experiment. Notably, our synthetic compound 5cd was found to display the powerful antidiabetic effect, stronger than that of metformin and TMPA (5ac).",
    "119":  "The first total synthesis and biological evaluation of penchinone A and its structural analogues are described. The key steps for the preparation of penchinone A derivatives involve the oxime-directed palladium(II)-catalyzed oxidative acylation, Claisen rearrangement, and base-mediated olefin migration. This transformation efficiently provides a range of allyl-substituted biaryl ketones with site-selectivity and functional group compatibility. In addition, all synthetic compounds were screened for anti-inflammatory activity against nitric oxide (NO), tumor necrosis factor alpha (TNF-α), and interleukin-6 (IL-6) with lipopolysaccharide (LPS)-induced RAW264.7 cells. Generally, a range of penchinone A derivatives potently inhibited NO, TNF-α, and IL-6 productions, compared to dexamethasone as a positive control. Notably, penchinone A (8g) and its derivatives (8e and 8f) were found to exhibit anti-inflammatory activity stronger than that of dexamethasone.",
    "112":  "The aldimine-directed C-H amidation of various arenes with N-acyl azides as amidation surrogates under cationic iridium(III) catalysis is described. This transformation efficiently provides a range of 2-aminobenzaldehyde derivatives with excellent site selectivity and functional group compatibility. The resulting 2-aminobenzaldehyde framework provides facile access to a range of biologically interesting heterocycles. In addition, all synthetic compounds were screened for anti-inflammatory activity against interleukin-1β (IL-1β) and tumor necrosis factor alpha (TNF-α) with lipopolysaccharide (LPS)-induced RAW264.7 cells. Generally, a range of ortho-amidated benzaldehydes displayed promising inhibitory activity against IL-1β and TNF-α compared to dexamethasone as a positive control. Notably, compounds (3ae and 4ac) were found to exhibit potent anti-inflammatory activity stronger than that of dexamethasone.",
    "108":  "The iridium(III)-catalyzed ortho-C-H amidation of benzoic acids with sulfonyl azides is described. These transformations allow the facile generation of N-sulfonyl anthranilic acids, which are known as crucial scaffolds found in biologically active molecules. In addition, all synthetic products were evaluated for in vitro anti-inflammatory activity against interleukin-1β (IL-1β) and cyclooxygenase-2 (COX-2) with lipopolysaccharide (LPS)-induced RAW264.7 cells. Notably, compounds 4c and 4d, generated from p-OMe- and p-Br-sulfonyl azides, were found to display potent anti-inflammatory property stronger than that of well-known NSAIDs ibuprofen.",
    "104":  "The rhodium(III)-catalyzed redox-neutral coupling reaction of N-acyl ketimines generated in situ from 3-hydroxyisoindolinones with various activated olefins is described. This approach leads to the synthesis of bioactive spiroisoindolinone derivatives in moderate to high yields. In the case of internal olefins such as maleimides, maleates, fumarates, and cinnamates, spiroindanes were obtained by the [3 + 2] annulations reaction. In sharp contrast, acrylates and quinones displayed the β-H elimination followed by Prins-type cyclization furnishing spiroindenes. The synthetic compounds were evaluated for in vitro anticancer activity against androgen-sensitive human prostate adenocarcinoma cells (LNCaP), human prostate adenocarcinoma cells (DU145), human endometrial adenocarcinoma cells (Ishikawa), human breast cancer cell (MCF-7), and triple negative human breast cancer cells (MDA-MB-231). Notably, quinone-containing spiroindenes displayed potent anticancer activity about 2- to 3-fold stronger than that of anticancer agent doxorubicin.",
    "102":  "The sirtuins (SIRTs), a family of NAD+-dependent class III histone deacetylase, are involved in various biological processes including cell survival, division, senescence, and metabolism via activation of the stress-response pathway. Recently, inhibition of SIRTs has been considered a promising anticancer strategy, but their precise mechanisms of action are not well understood. In particular, the relevance of p53 to SIRT-induced effects has not been fully elucidated. We investigated the anticancer effects of a novel SIRT inhibitor, MHY2256, and its efficacy was compared to that of salermide in MCF-7 (wild-type p53) and SKOV-3 (null-type p53) cells. Cell viability, SIRT1 enzyme activity, cell cycle regulation, apoptosis, and autophagic cell death were measured. We compared sensitivity to cytotoxicity in MCF-7 and SKOV-3 cells. MHY2256 significantly decreased the viability of MCF-7 (IC50, 4.8 μM) and SKOV-3 (IC50, 5.6 μM) cells after a 48 h treatment period. MHY2256 showed potent inhibition (IC50, 0.27 mM) against SIRT1 enzyme activity compared with nicotinamide (IC50, \u003e1 mM). Moreover, expression of SIRT (1, 2, or 3) protein levels was significantly reduced by MHY2256 treatment in both MCF-7 and SKOV-3 cells. Flow cytometry analysis revealed that MHY2256 significantly induced cell cycle arrest in the G1 phase, leading to an effective increase in apoptotic cell death in MCF-7 and SKOV-3 cells. A significant increase in acetylated p53, a target protein of SIRT, was observed in MCF-7 cells after MHY2256 treatment. MHY2256 up-regulated LC3-II and induced autophagic cell death in MCF-7 cells. Furthermore, MHY2256 markedly inhibited tumor growth in a tumor xenograft model of MCF-7 cells. These results suggest that a new SIRT inhibitor, MHY2256, has anticancer activity through p53 acetylation in MCF-7 human breast cancer cells.",
    "96":  "The rhodium(III)-catalyzed cross-coupling reaction of 8-methylquinolines and maleimides is described. In contrast to the C(sp(2))-H functionalization, a first catalytic functionalization of sp(3) C-H bonds with maleimides is reported. This protocol provides a facile access to various succinimide scaffolds on 8-methylquinolines via a direct C-H cleavage approach.",
    "94":  "A new heteroleptic luminescent and photocytotoxic ruthenium(II) polypyridyl complex, [RuII(bphen)2(cur)]+ (bphen = bathophenanthroline, cur = curcumin), has been thoroughly investigated for its photophysical properties with potential as a luminescent probe for bioimaging and a photocytotoxic agent. The optimized lead complex was obtained via coordinating curcumin to the Ru(II) center pre-coordinated with two bathophenanthroline ligands, producing a stable cationic structure with extended π-conjugation. The incorporation of curcumin to {Ru(bphen)2} moiety improves emissive characteristics and also enhances the biological compatibility, owing to its natural origin and functional groups that interact with biomolecular environments. The complex exhibits good photostability and strong emission under physiological conditions, enabling its application as a luminescent stain for fluorescence-based cellular imaging. Furthermore, in vitro photocytotoxicity studies in the human breast cancer cell line MCF-7 reveal a significant photocytotoxicity index (PI ∼ 19.5), indicating low dark toxicity but an enhanced cytotoxic response upon visible-light irradiation. These findings highlight the dual functionality of the [RuII(bphen)2(cur)]+ as a theragnostic agent, serving as a luminescent bioimaging probe and a potential photosensitizing agent for light-activated therapeutic applications.",
    "92":  "The rhodium(III)-catalyzed γ-trifluoromethylallylation of various heterocyclic C-H bonds with CF3-substituted allylic carbonates is described. These reactions provide direct access to linear CF3-containing allyl frameworks with complete trans-selectivity via C-H bond activation followed by a formal SN-type reaction pathway.",
    "91":  "The rhodium(III)-catalyzed direct cross-coupling reaction of electron-deficient acrylamides with maleimides is described. This protocol displays broad functional group tolerance and high efficiency, which offers a new opportunity to access highly substituted succinimides. Dependent on the substituent positions of acrylamides and reaction conditions, olefin migrated products were obtained with high regio- and stereoselectivity.",
    "90":  "Histone deacetylase (HDAC) inhibitors have been recognized as promising approaches to the treatment of various human diseases including cancer, inflammation, neurodegenerative diseases, and metabolic disorders. Several pan-HDAC inhibitors are currently approved only as anticancer drugs. Interestingly, SAHA (vorinostat), one of clinically available pan-HDAC inhibitors, shows an anti-inflammatory effect at concentrations lower than those required for inhibition of tumor cell growth. It was also reported that HDAC6 selective inhibitor tubastatin A has anti-inflammatory and anti-rheumatic effect. In our efforts to develop novel HDAC inhibitors, we rationally designed various HDAC inhibitors based on the structures of two hit compounds identified by virtual screening of chemical database. Among them, 9a ((E)-N-hydroxy-4-(2-styrylthiazol-4-yl)butanamide) was identified as a HDAC6 selective inhibitor (IC50 values of 0.199 μM for HDAC6 versus 13.8 μM for HDAC1), and it did not show significant cytotoxicity against HeLa cells. In vivo biological evaluation of 9a was conducted on a lipopolysaccharide (LPS)-induced mouse model of sepsis. The compound 9a significantly improved 40% survival rate (P = 0.0483), and suppressed the LPS-induced increase of TNF-α and IL-6 mRNA expression in the liver of mice. Our study identified novel HDAC6 selective inhibitor 9a, which may serve as a potential lead for the development of anti-inflammatory or anti-sepsis agents.",
    "89":  "The rhodium(III)-catalyzed mild and site-selective C-H allylation of enol carbamates with 4-vinyl-1,3-dioxolan-2-one and allylic carbonates affords allylic alcohols and terminal allylated products, respectively. The assistance of the carbamoyl directing group provides a straightforward preparation of biologically and synthetically important allylated enol carbamates.",
    "83":  "The rhodium(III)-catalyzed direct functionalization of aniline C-H bonds with α-diazo compounds is described. These transformations provide a facile construction of ortho-alkylated anilines with diazo malonates or highly substituted indoles with diazo acetoacetates.",
    "82":  "The rhodium(III)-catalyzed site-selective C-H alkylation of various N-heterocycles, such as indolines, carbazoles, and pyrroles with readily available allylic alcohols is described. This protocol allows the generation of a heterocyclic scaffold containing a β-aryl carbonyl moiety, which is known to be a crucial structural unit of biologically active compounds.",
    "81":  "Atomoxetine is a cytochrome P450 (P450) 2D6 probe substrate and an approved medicine for attention-deficit/hyperactivity disorder. In this humanized-liver mouse study, interactions between atomoxetine and the P450 2D6 probe drug paroxetine were observed. Human physiologically based pharmacokinetic (PBPK) models were established by scaling up humanized-liver mouse data obtained in the absence or presence of paroxetine. These models could explain the drug monitoring results of atomoxetine and its primary 4-hydroxylated and N-demethylated metabolites in Japanese children aged 8-14 years and could be used to help establish the correct dosage and for the evaluation of clinical outcomes. The results of simple PBPK models (using input parameters that reflected the subjects\u0027 small body size and normal or reduced P450 2D6-dependent clearance) were in general agreement with one-point measured plasma concentrations of atomoxetine and its 4-hydroxylated and N-demethylated metabolites in 13 pediatric participants. Unexpectedly high hepatic exposure, possibly in intermediate-metabolizer patients harboring CYP2D6*10 or 2D6*36 alleles, might in part explain the adverse effects of atomoxetine prescribed alone recorded in a Japanese adverse-event database. The steady-state, one-point drug monitoring data from the participants indicated extensive biotransformation of atomoxetine to 4-hydroxyatomoxetine under individually prescribed doses of atomoxetine. These results also suggest that a relatively narrow range of 4-hydroxyatomoxetine and N-desmethylatomoxetine concentration ratios in spot urine and/or plasma samples from pediatric patients could be a simple semiquantitative determinant factor for P450 2D6 intermediate metabolizers, compared with the wide range of concentrations of the two primary metabolites and substrate in extensive metabolizers. Significance Statement Validated simple pharmacokinetic models are able to predict steady-state plasma concentrations of the approved medicine atomoxetine and its primary metabolites in the majority of pediatric patients. The package insert advises careful dose escalation, especially for poor metabolizers; however, no simple way exists to determine P450 2D6 phenotypes. A relatively narrow range ratio of 4-hydroxyatomoxetine and N-desmethylatomoxetine in spot urine/plasma samples could be a simple semi-quantitative determinant factor for P450 2D6 intermediate metabolizers to optimize or confirm the correct dosage.",
    "80":  "The rhodium(III)-catalyzed ortho-C-H amidation of azobenzenes with arylsulfonyl and aryl and alkyl isocyanates is described. The N-sulfonyl amidation reaction using arylsulfonyl isocyanates is first reported in the C-H activation strategy. These transformations provide the facile and efficient construction of a range of amide moieties into azobenzenes.",
