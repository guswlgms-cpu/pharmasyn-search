    "73":  "In 1979, an unusual, carbocyclic nucleoside was discovered in a Japanese fermentation broth and designated neplanocin A. This compound is an analog of adenosine possessing a cyclopentene-containing \"sugar\" glycon. Although neplanocin A was biologically active, it was quite toxic. It therefore became a lead compound for analog synthesis in an attempt to maximize antitumor and antiviral activity while minimizing toxicity. First, a total synthesis of naturally occurring (-)-neplanocin A was accomplished using a new, versatile cyclopentenone carbocyclic \"sugar\" intermediate. This intermediate was then used to synthesize some 20 purine and pyrimidine analogs of neplanocin A which were evaluated for their antitumor and antiviral properties. Among the purine analogs, 3-deazaneplanocin A, a powerful inhibitor of S-adenosylhomocysteine hydrolase, was found to have excellent antiviral activity both in vitro and in vivo. Cyclopentenyl cytosine (CPE-C) was found to be the most biologically active compound among the carbocyclic pyrimidine nucleosides. In addition to activity against over 20 viruses, this compound had excellent preclinical antitumor activity against both murine leukemias and human tumor xenografts. CPE-C is currently under clinical evaluation as an anticancer drug.",
    "70":  "Palladium-catalyzed decarboxylative acylation of highly substituted indolines with α-keto acids via C-H bond activation is described. This protocol provides efficient access to C7-carbonylated indoles known to have diverse biological profiles.",
    "69":  "A ketone-assisted ruthenium-catalyzed selective amination of xanthones and chromones C-H bonds with sulfonyl azides is described. The reactions proceed efficiently with a broad range of substrates with excellent functional group compatibility. This protocol provides direct access to 1-aminoxanthones, 5-aminochromones, and 5-aminoflavonoid derivatives known to exhibit potent anticancer activity.",
    "67":  "The ruthenium-catalyzed oxidative allylation of aromatic and α,β-unsaturated carboxamides with allylic carbonates is described. These transformations proceed readily with complete linear γ-selectivity of substituted allylic carbonates.",
    "66":  "The ethanol extract of Zanthoxylum piperitum (L.) DC. showed in vitro antiviral activity against influenza A virus. Three flavonol glycosides were isolated from the EtOAc fraction of Z. piperitum leaf by means of activity-guided chromatographic separation. Structures of isolated compounds were identified as quercetin 3-O-β-D-galactopyranoside (1), quercetin 3-O-α-L-rhamnopyranoside (2), kaempferol 3-O-α-L-rhamnopyranoside (3) by comparing their spectral data with literature values. The anti-influenza viral activity of isolates was evaluated using a plaque reduction assay against influenza A/NWS/33 (H1N1) virus. The compounds also were subjected to neuraminidase inhibition assay in influenza A/NWS/33 virus. Compounds 1-3 exhibited antiviral activity against an influenza A virus in vitro, and inhibited the neuraminidase activity at relatively high concentrations.",
    "64":  "A copper-catalyzed oxidative coupling of 2-carbonyl-substituted phenols and 1,3-dicarbonyl compounds with a wide range of dibenzyl or dialkyl ethers is described. This protocol provides an efficient preparation of phenol esters and enol esters in good yields with high chemoselectivity. This method represents an alternative protocol for classical esterification reactions.",
    "60":  "A palladium-catalyzed oxidative coupling of arene C-H bonds with benzylic ethers via C-H bond activation is described. The reaction proceeds efficiently with a broad range of substrates bearing conventional directing groups with excellent functional group compatibility. This protocol potentially provides opportunities to use dibenzyl ethers as new acyl equivalents for catalytic acylation reactions.",
    "59":  "A palladium(II)-catalyzed direct acylation of acetophenone N-Boc hydrazones with aldehydes via C-H bond activation is described. This protocol provides direct access to a range of 1,2-diacylbenzenes, which are useful precursors to construct biologically interesting and pharmaceutically important compounds.",
    "56":  "Tandem rhodium-catalyzed oxidative allylation and annulation of acetanilides with allyl acetate to afford the corresponding indoles are described. In addition, the site-selective C2 allylation, crotylation and prenylation of indoles using allylic acetates under rhodium catalysis are reported.",
    "49":  "A palladium-catalyzed ortho-acylation of N-benzyltriflamides from the alcohol oxidation level via C-H bond activation is described. These transformations have been applied to a wide range of substrates, and typically proceed with excellent levels of chemoselectivity and with high functional group tolerance.",
    "47":  "A palladium-catalyzed decarboxylative acylation of phenylacetamides with α-oxocarboxylic acids via C-H bond activation is described. This protocol provides efficient access to a range of ortho-acyl phenylacetamides, which can be easily converted to 3-isochromanone derivatives.",
    "46":  "Aryltetralin lactones featuring vicinal stereogenic centers at their ring junctions are important scaffolds in pharmacologically relevant cyclolignans. Currently, the direct and efficient assembly of tetracyclic core scaffolds from simple acyclic precursors is challenging. Herein, we developed a conformation-assisted radical-initiated iodocarbocyclization of C-(sp3)-H bonds in 5-alkenylmalonates. This was followed by lactonization for the direct assembly of aryltetralin lactone scaffolds. Nine aryltetralin lactone cyclolignans were successfully produced by unified asymmetric total syntheses. This methodology shows potential for advancing both medicinal chemistry and biological research.",
    "44":  "This work presents a palladium-catalyzed oxime ether-directed ortho-selective benzoylation using benzoylformic acid as the acyl source with a palladium catalyst and 4CzIPN as the co-catalyst under light. Various non-symmetric benzophenone derivatives were obtained in moderate to good yields. A preliminary mechanism study revealed that the reaction proceeds through a free radical pathway.",
    "43":  "Sixteen arene-Ru based molecular-rectangles were self-assembled in high yields by the equimolar mixing of arene-Ru acceptors (Aa-Ad) with various azopyridyl ligands (1,2-di(pyridyl-4yl)diazene (L1), 1,2-bis(pyridin-4-ylmethylene)hydrazine (L2), 1,2-bis(1-(pyridin-4-yl)ethylidene)hydrazine (L3), 1,2-bis(pyridin-4-ylmethylene)hydrazine (L4)) in nitromethane-methanol solutions. These new molecular-rectangles were fully characterized by a host of analytical techniques including elemental analysis, (1)H and (13)C NMR and HR-ESI-MS. The solid-state structures of two molecular-rectangles (1b and 4d) were determined by single crystal X-ray diffraction data. UV-visible and fluorescence studies were also carried out for the entire suite of rectangles. As with recent studies of similar arene-Ru complexes, the anti-proliferative activities of these complexes were evaluated against SK-hep-1 (liver cancer) and A-549 (lung cancer) human cancer lines. Additionally, the cellular pharmacology and intracellular localizations in AGS (gastric cancer) human cancer cells were determined for selected complexes (1c, 1d and 4c) by apoptosis and fluorescence microscopy studies. These studies confirm that arene-Ru molecular-rectangles inhibit cell cycle progression to the G0 phase, in contrast to that of cisplatin which arrests cell growth in the G2 phase.",
    "40":  "The synthesis and biological evaluation of a series of novel norlignans are described. Norlignans were evaluated for their inhibitory activity on the release of β-hexosaminidase, a marker of degranulation, from RBL-2H3 cells induced by the IgE-antigen complex. The results showed that norlignans 4c and 4e potently inhibited degranulation, with IC(50) values of 18.3 and 17.9 μM, respectively.",
    "39":  "A suite of eight cationic, tetra-metallic molecular rectangles (1-8) was generated via coordination-driven self-assembly using four dicarboxylate-bridged arene-Ru precursors (A1-A4) with one of two dipyridyl ligands (D1, D2). The high-yielding (84-92%) rectangles were characterized by (1)H NMR and HR-ESI-MS to support their structural assignments. The molecular structure of 5 was determined by single crystal X-ray analysis, which indicated that two D2 ligands bridge two A1 acceptors to form a rectangular construct. The photophysical properties of these metalla-rectangles and their molecular precursors were also investigated, as well as an MTT assay to evaluate the in vitro cytotoxicities relative to two chemotherapeutic agents, cisplatin and doxorubicin. MTT assays were conducted using SK-hep-1 (liver cancer) and HCT-15 (colon cancer) human cancer cell lines. Compounds 3, 4, 7 and 8 showed significant activity, with IC(50) values comparable to those of cisplatin and doxorubicin.",
    "36":  "Enhancing charge transfer efficiency between molecular photosensitizers and catalytic units remains a pivotal yet challenging objective in developing advanced photocatalytic systems. Herein, we present a crystallographic self-assembly strategy to construct Ru@MoS-MBIZ─a periodically ordered supramolecular architecture, wherein cationic photosensitizers, [Ru(bpy)3]2+, are electrostatically immobilized within cavities formed by anionic molybdenum-sulfur (Mo-S) clusters ([Mo3S7(MBIZ)3]-), enabling spatially defined coupling between light-harvesting and catalytic moieties. The atomically precise arrangement not only enhances structural stability and light absorption but also optimizes the electronic structure and energy-level alignment, facilitating efficient charge separation and directional charge transfer. The integrated system exhibits outstanding photocatalytic performance for hydrogen production with an impressive generation rate of 46 mmol g-1 h-1─118 and 4.5 times higher than those of pristine MoS-MBIZ and a physical mixture of [Ru(bpy)3]Cl2/MoS-MBIZ, respectively, surpassing most noble-metal-assisted crystalline photocatalysts. Notably, this integrated strategy enables a leap from single- to dual-function photocatalysis, concurrently achieving visible-light-driven trifluoromethylation with \u003e85% yield for trifluorotoluene and a broad substrate scope covering 25 diverse (hetero)arenes and pharmaceuticals, marking the first extension of Mo-S clusters to organic photosynthesis. Mechanistic investigations through experimental and theoretical analyses confirm enhanced charge separation and directional electron transfer from Ru to Mo centers. This work establishes a blueprint for programmable multifunctional photocatalysts via electrostatic confinement and crystallographic integration.",
    "32":  "A rhodium-catalyzed oxidative acylation of benzamides with aryl aldehydes via direct sp(2) C-H bond cleavage is described. In the presence of [Cp*RhCl(2)](2), AgSbF(6), and silver carbonate as an oxidant, N,N-diethyl benzamides can be effectively carbonylated to yield ortho-acyl benzamides.",
    "31":  "The synthesis of new 2+2 metalla-rectangles via coordination driven self-assembly of octahedral Ru(II) based acceptors and amide donors is described. To evaluate their in vitro cytotoxic properties, preliminary biological assays were carried out for various human cancer cell lines, and our results show that the cytotoxicity level of 3 is comparable or even greater in the cases of SK-hep-1 and HCT-15 than that of the reference drug cisplatin.",
    "30":  "One-pot synthesis of symmetric 1,4-disubstituted 1,3-diynes from iodoarenes and propiolic acid via Sonogashira reaction followed by Pd-catalyzed decarboxylative homocoupling is developed in high yields. Also, this system allows the one-pot synthesis of unsymmetric 1,4-disubstituted 1,3-diynes by cross-coupling of two different 3-substituted propiolic acids.",
    "29":  "Two novel nano-cage compounds, 8 and 9, were prepared by self-assembly of the ruthenium complexes 4 and 5, and the tripodal donor 1. The cytotoxicity of 8 was found to be considerably stronger than that of cisplatin. The complex 8 inhibited tumor cell proliferation by interfering into regulatory pathways of the cell cycle via apoptosis.",
    "24":  "Existing methods for enantioselective carbonyl allylation, crotylation and tert-prenylation require stoichiometric generation of pre-metallated nucleophiles, and often employ stoichiometric chiral modifiers. Under the conditions of transfer hydrogenation employing an ortho-cyclometallated iridium C,O-benzoate catalyst, enantioselective carbonyl allylations, crotylations and tert-prenylations are achieved in the absence of stoichiometric metallic reagents or stoichiometric chiral modifiers. Moreover, under transfer hydrogenation conditions, primary alcohols function dually as hydrogen donors and aldehyde precursors, enabling enantioselective carbonyl addition directly from the alcohol oxidation level.",
    "23":  "The chiral ruthenium complex formed in situ from (TFA)2Ru(CO)(PPh3)2 and (R)-BINAP is found to catalyze the enantioselective C-C coupling of diverse primary alcohols with the 1,3-enyne, TMSC≡CC(Me)═CH2, to form secondary homopropargyl alcohols bearing gem-dimethyl groups. All reagents for this byproduct-free coupling are inexpensive and commercially available, making this protocol a practical alternative to stoichiometric carbanions in enantioselective carbonyl reverse prenylation.",
    "22":  "Unstable? We\u0027re able! 1,n-Glycols serve as synthetic equivalents to unstable dialdehydes in two-directional carbonyl allylation from the alcohol oxidation level under iridium-catalyzed transfer hydrogenation conditions. Iterative asymmetric allylation employing 1,3-propanediol enables the rapid assembly of protected 1,3-polyol substructures with exceptional levels of stereocontrol.",
    "21":  "The first enantioselective carbonyl crotylations through direct use of alkynes as chiral allylmetal equivalents are described. Chiral ruthenium(II) complexes modified by Josiphos (SL-J009-1) catalyze the C-C coupling of TIPS-protected propargyl ether 1a with primary alcohols 2a-2o to form products of carbonyl siloxy-crotylation 3a-3o, which upon silyl deprotection-reduction deliver 1,4-diols 5a-5o with excellent control of regio-, anti-diastereo-, and enantioselectivity. Structurally related propargyl ethers 1b and 1c bearing ethyl- and phenyl-substituents engage in diastereo- and enantioselective coupling, as illustrated in the formation of adducts 5p and 5q, respectively. Selective mono-tosylation of diols 5a, 5c, 5e, 5f, 5k, and 5m is accompanied by spontaneous cyclization to deliver the trans-2,3-disubstituted furans 6a, 6c, 6e, 6f, 6k, and 6m, respectively. Primary alcohols 2a, 2l, and 2p were converted to the siloxy-crotylation products 3a, 3l, and 3p, which upon silyl deprotection-lactol oxidation were transformed to the trans-4,5-disubstituted γ-butyrolactones 7a, 7l, and 7p. The formation of 7p represents a total synthesis of (+)-trans-whisky lactone. Unlike closely related ruthenium catalyzed alkyne-alcohol C-C couplings, deuterium labeling studies provide clear evidence of a novel 1,2-hydride shift mechanism that converts metal-bound alkynes to π-allyls in the absence of intervening allenes.",
    "20":  "Classical protocols for carbonyl allylation, propargylation and vinylation typically rely upon the use of preformed allyl metal, allenyl metal and vinyl metal reagents, respectively, mandating stoichiometric generation of metallic byproducts. Through transfer hydrogenative C-C coupling, however, carbonyl addition may be achieved from the aldehyde or alcohol oxidation level in the absence of stoichiometric organometallic reagents or metallic reductants. Here, we review transfer hydrogenative methods for carbonyl addition, which encompass the first catalytic protocols enabling direct C-H functionalization of alcohols.",
    "18":  "The enantioselective iridium(I)-catalyzed hydroarylation of C-C unsaturated bonds ranks among the most atom-efficient technologies in organic synthesis. We now report an enantioselective desymmetrizing cyclization that entails carbonyls instead of C═C partners, providing direct access to architecturally complex (hetero)polycyclic frameworks bearing a tertiary alcohol and an adjacent all-carbon quaternary stereocenter at their ring junctions. The in situ dehydration of the initially formed alcohol was occasionally observed to yield products bearing an allylic quaternary stereocenter, which offers excellent opportunities for downstream functionalization. Mechanistically intriguing, we demonstrated that this dehydration can be suppressed by adding Et3SiH, an additive that also accelerates the overall transformation. Computational studies support a carbometalation/O-H reductive elimination pathway and shed light on the stereochemical origin of the enantioselectivity.",
    "17":  "The enantioselective iridium(I)-catalyzed hydroarylation of C-C unsaturated bonds ranks among the most atom-efficient technologies in organic synthesis. We now report an enantioselective desymmetrizing cyclization that entails carbonyls instead of C═C partners, providing direct access to architecturally complex (hetero)polycyclic frameworks bearing a tertiary alcohol and an adjacent all-carbon quaternary stereocenter at their ring junctions. The in situ dehydration of the initially formed alcohol was occasionally observed to yield products bearing an allylic quaternary stereocenter, which offers excellent opportunities for downstream functionalization. Mechanistically intriguing, we demonstrated that this dehydration can be suppressed by adding Et3SiH, an additive that also accelerates the overall transformation. Computational studies support a carbometalation/O-H reductive elimination pathway and shed light on the stereochemical origin of the enantioselectivity.",
    "16":  "Exposure of carboxylic acids 1a-12a to commercially available 1,1-dimethylallene in the presence of substoichiometric quantities of an iridium catalyst prepared in situ from [Ir(cod)Cl]2 and BIPHEP provides the corresponding 1,1-dimethylallyl (reverse prenyl) esters 1b-12b in 74-92% isolated yield. This protocol represents the first branch-regioselective allene hydrocarboxylation. Stoichiometric byproducts are not generated in this process and protecting groups are not required for alcohols, phenols, and indolic amines.",
    "13":  "A new efficient method for the synthesis of geometrically pure (E)-alkenes from (Z)-alkenes is described. The reaction of aryl- or alkyl-substituted (Z)-alkenes with tributyltin hydride and triethylamine in the presence of a catalytic amount of palladium acetate afforded the corresponding (E)-alkenes in good yields.",
    "9":  "Crystal structures were obtained for the two C2 epimeric azido-γ-lactones 2-azido-2-deoxy-3,5:6,7-di-O-isopropylidene-d-glycero-d-ido-heptono-1,4-lactone and 2-azido-2-deoxy-3,5:6,7-di-O-isopropylidene-d-glycero-d-gulo-heptono-1,4-lactone prepared from kinetic and thermodynamic azide displacements of a triflate derived from d-glucoheptonolactone. Azido-γ-lactones are very useful intermediates in the synthesis of iminosugars and polyhydroxylated amino acids. In this study two epimeric azido-heptitols allow biotechnological transformations via Izumoring techniques to 8 of the 16 possible homonojirimycin analogues, 5 of which were isolated pure because of the lack of stereoselectivity of the final reductive amination. A side-by-side glycosidase inhibition profile of 11 of the possible 16 HNJ stereoisomers derived from d-glucose and d-mannose is presented.",
    "8":  "A stereoselective approach for synthesizing (2R,5S)-dihydroxymethyl-(3R,4R)-dihydroxypyrrolidine 1 (2,5-dideoxy-2,5-imino-d-glucitol, DGDP) was achieved using a seven-step approach starting from 2,3,4,6-tetra-O-benzyl-d-mannose (7). Key steps for the preparation of the title compound 1 involved the regioselective and diastereoselective amination of the cinnamyl anti-1,2-polybenzyl ethers 5 and 6 using chlorosulfonyl isocyanate (CSI) and ring cyclization to form the pyrrolidine ring. The reaction between anti-1,2-polybenzyl ether 5 and CSI in toluene at 0 degrees C afforded the corresponding anti-1,2-amino alcohol 4 as a major product with a diastereoselectivity of 16:1 in 76% yield. The mechanism underlying these reactions may be explained by the neighboring-group effect leading to the retention of stereochemistry.",
    "6":  "Previously, we found that a furocoumarin derivative, psoralen (7H-furo[3,2-g][1]benzopyran-7-one), blocked a human Kv1.5 potassium channel (hKv1.5) and has a potential antiarrhythmic effect. In the present study, to develop more potent hKv1.5 blockers or antiarrhythmic drugs, we synthesized ten psoralen derivatives and examined their blocking effects on hKv1.5 stably expressed in Ltk cells. Among the newly synthesized psoralen derivatives, three derivatives (Compounds 5, 9 and 10) showed the open channel-blocking effect. Compound 9 among them was the most potent in blocking hKv1.5. We found that compound 9, one of the psoralen derivatives, inhibited the hKv1.5 current in a concentration-, use- and voltage-dependent manner with an IC50 value of 27.4 +/- 5.1 nM at +60 mV. Compound 9 accelerated the inactivation kinetics of the hKv1.5 channel, slowed the deactivation kinetics of hKv1.5 current resulting in a tail crossover phenomenon. Compound 9 inhibited hKv1.5 current in a use-dependent manner. These results indicate that compound 9, one of psoralen derivatives, acts on hKv1.5 channel as an open channel blocker and is much more potent than psoralen in blocking hKv1.5 channel. If further studies were done, compound 9 might be an ideal antiarrhythmic drug for atrial fibrillation.",
    "5":  "The total syntheses of DAB1 (1) and (-)-lentiginosine (2) were concisely accomplished from D-lyxose via regioselective and diastereoselective NHCbz introduction using CSI, chemoselective removal of the Cbz protection, and ring-closing metathesis as key steps."
};

<script>
const FIELDS = [
  ["reaction", "반응 유형"], ["starting", "출발물질"], ["partner", "커플링 파트너"], ["product", "생성물"],
  ["catalyst", "촉매"], ["additive", "첨가제"], ["solvent", "용매"], ["temp", "온도/시간"],
  ["scope", "범위/결과"], ["target", "타깃"], ["compound", "대표 화합물"], ["keywords", "키워드"],
  ["metal", "금속"], ["title", "제목"], ["journal", "저널"], ["category", "분야"], ["abstract", "초록"]
];
const CAT_LABEL = { methodology: "메소돌로지", medchem: "의약화학·생물", other: "기타" };
const PAGE = 40;
let shown = PAGE;
PAPERS.forEach(p => {
  if (window.ABSTRACTS && ABSTRACTS[p.no]) p.abstract = ABSTRACTS[p.no];
  p.journal = p.journal.replace(/^Tetrahedron\.$/, "Tetrahedron").replace(/Med\. Chem\. Let\.$/, "Med. Chem. Lett.");
});
const SHOWN = ["reaction", "starting", "partner", "product", "catalyst", "additive", "solvent", "temp", "target", "compound", "scope"];
const SUGGEST = ["C-H activation", "Lewis acid", "VCP", "Rh", "Co", "HFIP", "allylation", "annulation", "의약화학", "2026"];

const norm = s => String(s).toLowerCase()
  .replace(/[‐-―−]/g, "-").replace(/\s*\+\s*/g, "+").replace(/\s+/g, " ").trim();
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");

// synonym lookup: normalized member -> group
const GROUP = new Map();
SYNONYMS.forEach(g => g.forEach(m => GROUP.set(norm(m), g.map(norm))));
const MULTI = [...GROUP.keys()].filter(k => k.includes(" ")).sort((a, b) => b.length - a.length);

// Build a regex for one variant. Short/latin variants need a word boundary so "co" does not hit "compound".
function variantRe(v) {
  const latin = /^[a-z0-9]/.test(v);
  const pre = latin ? "(?<![a-z0-9])" : "";
  const post = latin && v.length <= 3 ? "(?![a-z])" : "";
  return pre + reEsc(v) + post;
}

function parseQuery(raw) {
  let q = " " + norm(raw).replace(/,/g, " ") + " ";
  const terms = [];
  q = q.replace(/"([^"]+)"/g, (_, t) => { terms.push(t.trim()); return " "; });
  for (const m of MULTI) {
    const re = new RegExp("(?<=\\s)" + reEsc(m) + "(?=\\s)", "g");
    q = q.replace(re, () => { terms.push(m); return " "; });
  }
  q.split(" ").filter(Boolean).forEach(t => terms.push(t));
  return terms.map(t => {
    const yr = t.match(/^(\d{4})(?:[-~](\d{4})?)?$/);
    if (yr) return { raw: t, year: [+yr[1], t.includes("-") || t.includes("~") ? (+yr[2] || 9999) : +yr[1]] };
    const vars = GROUP.get(t) || [t];
    // Korean aliases and 1–2 letter symbols (pd, co, ag) only point to the group; the paper
    // data carries the full name, so matching on the short form would only add false hits (anti-PD-L1).
    const usable = vars.filter(v => !/^[가-힣]/.test(v) && v.length > 2);
    if (!usable.length) usable.push(t);
    // Element symbols are matched case-sensitively as they appear in formulas: Ag in AgSbF6, Rh in [RhCp*...
    const syms = vars.filter(v => /^[a-z]{1,2}$/.test(v)).map(v => v[0].toUpperCase() + v.slice(1));
    const sym = syms.length ? new RegExp("(?<![A-Za-z])(" + syms.join("|") + ")(?![a-z])") : null;
    return { raw: t, re: new RegExp(usable.map(variantRe).join("|"), "i"), sym };
  });
}

function fieldText(p, f) {
  const v = p[f];
  if (f === "category") return v === "methodology" ? "methodology" : v === "medchem" ? "medicinal chemistry biology" : "other";
  return Array.isArray(v) ? v : (v ? [v] : []);
}

function search(raw, cat) {
  const terms = parseQuery(raw);
  const out = [];
  for (const p of PAPERS) {
    if (cat && p.category !== cat) continue;
    const why = [];
    let ok = true;
    for (const t of terms) {
      if (t.year) {
        if (p.year >= t.year[0] && p.year <= t.year[1]) { why.push([t.raw, "연도"]); continue; }
        ok = false; break;
      }
      const hit = FIELDS.find(([f]) => [].concat(fieldText(p, f)).some(x => t.re.test(norm(x)) || (t.sym && t.sym.test(x))));
      if (!hit) { ok = false; break; }
      why.push([t.raw, hit[1]]);
    }
    if (ok) out.push({ p, why, terms });
  }
  return out;
}

function hlAll(text, terms) {
  // apply every term's highlight without nesting marks
  let ranges = [];
  const n = String(text);
  for (const t of terms) {
    if (!t.re) continue;
    const re = new RegExp(t.re.source.replace(/-/g, "[-‐-―]"), "gi");
    let m;
    while ((m = re.exec(n)) && m[0].length) ranges.push([m.index, m.index + m[0].length]);
    if (t.sym) {
      const sre = new RegExp(t.sym.source, "g");
      while ((m = sre.exec(n)) && m[0].length) ranges.push([m.index, m.index + m[0].length]);
    }
  }
  if (!ranges.length) return esc(n);
  ranges.sort((a, b) => a[0] - b[0]);
  const merged = [ranges[0]];
  for (const r of ranges.slice(1)) {
    const last = merged[merged.length - 1];
    if (r[0] <= last[1]) last[1] = Math.max(last[1], r[1]); else merged.push(r);
  }
  let out = "", i = 0;
  for (const [a, b] of merged) { out += esc(n.slice(i, a)) + "<mark>" + esc(n.slice(a, b)) + "</mark>"; i = b; }
  return out + esc(n.slice(i));
}

let cat = "";
const $q = document.getElementById("q");

function render() {
  const raw = $q.value;
  const res = search(raw, cat);
  const terms = parseQuery(raw);
  document.getElementById("status").innerHTML = raw.trim() || cat
    ? `<b>${res.length}</b>편 찾음 · 전체 ${PAPERS.length}편`
    : `전체 <b>${PAPERS.length}</b>편 (최신순)`;
  document.getElementById("results").innerHTML = res.length ? res.slice(0, shown).map(({ p, why }) => {
    const rows = SHOWN.map(f => {
      const vals = [].concat(fieldText(p, f));
      if (!vals.length) return "";
      const label = FIELDS.find(x => x[0] === f)[1];
      return `<dt>${label}</dt><dd>${vals.map(v => `<span class="v">${hlAll(v, terms)}</span>`).join("")}</dd>`;
    }).join("");
    const whyTxt = why.length ? `<div class="why">일치: ${why.map(([t, f]) => `<b>${esc(t)}</b> → ${f}`).join(" · ")}</div>` : "";
    return `<article class="card">
      <img class="toc" loading="lazy" src="${esc(p.toc)}" alt="TOC graphic of paper ${p.no}">
      <div>
        <div class="meta"><span class="badge ${p.category}">${CAT_LABEL[p.category] || "기타"}</span>
          <span>#${p.no}</span><span>${esc(p.journal)} ${p.year}</span></div>
        <h2><a href="${esc(p.link)}" target="_blank" rel="noopener">${hlAll(p.title, terms)}</a></h2>
        <dl>${rows}</dl>
        ${p.abstract ? `<details class="abs"${why.some(w => w[1] === "초록") ? " open" : ""}><summary>초록</summary><p>${hlAll(p.abstract, terms)}</p></details>` : ""}
        ${whyTxt}
        <div class="foot">${p.doi ? `<a href="https://doi.org/${esc(p.doi)}" target="_blank" rel="noopener">DOI ${esc(p.doi)}</a>` : `<a href="${esc(p.link)}" target="_blank" rel="noopener">논문 페이지</a>`}<span>정보 출처: ${esc(p.source)}</span></div>
      </div>
    </article>`;
  }).join("") + (res.length > shown ? `<button class="more" id="more">더 보기 (${shown}/${res.length})</button>` : "")
  : `<div class="empty">조건에 맞는 논문이 없어요. 키워드를 줄이거나 다른 표현으로 검색해 보세요.</div>`;
}

function renderHints() {
  const cats = [["", "전체"], ["methodology", "메소돌로지"], ["medchem", "의약화학·생물"], ["other", "기타"]];
  document.getElementById("hints").innerHTML =
    cats.map(([v, l]) => `<button class="chip ${cat === v ? "on" : ""}" data-cat="${v}">${l}</button>`).join("") +
    `<span class="lbl" style="margin-left:10px">빠른 검색</span>` +
    SUGGEST.map(s => `<button class="chip" data-add="${esc(s)}">${esc(s)}</button>`).join("");
}

document.getElementById("hints").addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  shown = PAGE;
  if (b.dataset.cat !== undefined) { cat = b.dataset.cat; renderHints(); }
  if (b.dataset.add) {
    const add = b.dataset.add.includes(" ") ? `"${b.dataset.add}"` : b.dataset.add;
    $q.value = ($q.value.trim() + " " + add).trim();
  }
  render();
});
$q.addEventListener("input", () => { shown = PAGE; render(); });
const zoom = document.getElementById("zoom");
document.getElementById("results").addEventListener("click", e => {
  if (e.target.classList.contains("toc")) { zoom.querySelector("img").src = e.target.src; zoom.style.display = "flex"; }
  if (e.target.id === "more") { shown += PAGE; render(); }
});
zoom.addEventListener("click", () => zoom.style.display = "none");

renderHints();
render();

</script>
